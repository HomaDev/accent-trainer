<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pitch & Spectrogram Comparison</title>
  <style>
    body { 
      font-family: system-ui, sans-serif; 
      display: flex; 
      justify-content: center; 
      align-items: flex-start; 
      background: #fbfbfd; 
      padding-top: 30px; 
      gap: 20px;
    }
    .card { 
      background: white; 
      padding: 30px; 
      border-radius: 12px; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.06); 
      width: 600px; 
    }
    .sidebar {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      width: 250px;
      max-height: 80vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sentence-item {
      padding: 12px 10px;
      border-radius: 6px;
      border: 1px solid #e0e0e0;
      background: none;
      cursor: pointer;
      text-align: left;
      font-size: 14px;
      color: #333;
      transition: all 0.15s;
    }
    .sentence-item:hover { background: #f5f5f5; }
    .sentence-item.active { 
      border-color: #4562a1; 
      background: #eef2fb; 
      font-weight: 600;
    }

    /* Header Row for Title and Speed Controls */
    .header-row {
      display: flex;
      align-items: center;
      position: relative;
      margin-bottom: 25px;
    }
    .speed-controls {
      position: absolute;
      left: 0;
      top: 0;
      display: flex;
      gap: 5px;
    }
    .speed-btn {
      padding: 4px 8px;
      font-size: 12px;
      background: #eee;
      color: #555;
      border: 1px solid #ccc;
      cursor: pointer;
      border-radius: 4px;
      width: auto;
      font-weight: bold;
    }
    .speed-btn:hover { background: #e0e0e0; }
    .speed-btn.active {
      background: #4562a1;
      color: white;
      border-color: #4562a1;
    }
    .jp-text { width: 100%; text-align: center; font-size: 24px; font-weight: bold; margin: 0; }

    .panel-row { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
    .btn-col { display: flex; flex-direction: column; gap: 8px; min-width: 90px; }

    .canvas-wrapper {
      width: 460px;
      overflow-x: auto;
      border-radius: 6px;
      background: #000;
    }

    .canvas-wrapper::-webkit-scrollbar { height: 8px; }
    .canvas-wrapper::-webkit-scrollbar-track { background: #333; border-radius: 4px; }
    .canvas-wrapper::-webkit-scrollbar-thumb { background: #666; border-radius: 4px; }
    .canvas-wrapper::-webkit-scrollbar-thumb:hover { background: #888; }

    canvas {
      display: block;
      cursor: crosshair;
    }

    button { cursor: pointer; border: none; border-radius: 6px; padding: 10px 15px; font-weight: 600; color: white; width: 100%; box-sizing: border-box; }
    .btn-play { background: #4562a1; }
    .btn-play-user { background: #777; display: none; }
    .btn-record { background: #e0245e; }
    .btn-record.recording { background: #111; }

    .hint { font-size: 12px; color: #888; text-align: center; margin-top: -15px; margin-bottom: 20px; font-style: italic; }
  </style>
</head>
<body>

<div class="card">
  <div class="header-row">
    <div class="speed-controls">
      <button class="speed-btn active" data-speed="1.0">1x</button>
      <button class="speed-btn" data-speed="0.5">0.5x</button>
      <button class="speed-btn" data-speed="0.25">0.25x</button>
    </div>
    <div id="jpDisplay" class="jp-text">Select a sentence...</div>
  </div>

  <div class="hint">Scroll = Zoom In/Out | Shift + Scroll = Move Left/Right</div>

  <!-- Reference Audio Row -->
  <div class="panel-row">
    <div class="btn-col">
      <button id="playNativeBtn" class="btn-play">▶ Native</button>
    </div>
    <div class="canvas-wrapper" id="nativeWrapper">
      <canvas id="nativeCanvas" width="460" height="180"></canvas>
    </div>
  </div>

  <!-- User Recording Row -->
  <div class="panel-row">
    <div class="btn-col">
      <button id="recordBtn" class="btn-record">● Record</button>
      <button id="playUserBtn" class="btn-play-user">▶ Play</button>
    </div>
    <div class="canvas-wrapper" id="userWrapper">
      <canvas id="userCanvas" width="460" height="180"></canvas>
    </div>
  </div>
</div>

<div class="sidebar" id="sidebarList"></div>

<!-- Hidden audio elements -->
<audio id="nativePlayer"></audio>
<audio id="userPlayer"></audio>

<script>
  let mediaRecorder;
  let audioChunks = [];

  let pixelsPerSecond = 460 / 5;
  let currentPlaybackRate = 1.0;

  let currentNativeData = null;
  let currentUserData = null;

  const recordBtn = document.getElementById('recordBtn');
  const playUserBtn = document.getElementById('playUserBtn');
  const jpDisplay = document.getElementById('jpDisplay');
  const playNativeBtn = document.getElementById('playNativeBtn');
  const sidebarList = document.getElementById('sidebarList');

  const nativePlayer = document.getElementById('nativePlayer');
  const userPlayer = document.getElementById('userPlayer');

  let sentencesDb = [];

  fetch('/api/sentences')
    .then(res => res.json())
    .then(data => {
      sentencesDb = data;
      data.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'sentence-item';
        btn.textContent = item.text;
        btn.onclick = () => loadSentence(item, btn);
        sidebarList.appendChild(btn);
      });
    })
    .catch(err => console.log("Failed to load sentences API."));

  // --- Speed Control Logic ---
  document.querySelectorAll('.speed-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');

      currentPlaybackRate = parseFloat(e.target.dataset.speed);
      nativePlayer.playbackRate = currentPlaybackRate;
      userPlayer.playbackRate = currentPlaybackRate;
    });
  });

  async function loadSentence(sentence, btnElement) {
    document.querySelectorAll('.sentence-item').forEach(b => b.classList.remove('active'));
    btnElement.classList.add('active');

    jpDisplay.textContent = sentence.text;
    nativePlayer.src = '/' + sentence.audio_file;
    nativePlayer.playbackRate = currentPlaybackRate; // Enforce selected speed on new load

    const response = await fetch(`/analyze_native?filename=${sentence.id}`);
    currentNativeData = await response.json();
    drawContour('nativeCanvas', currentNativeData);

    currentUserData = null;
    const userCtx = document.getElementById('userCanvas').getContext('2d');
    document.getElementById('userCanvas').width = 460;
    userCtx.clearRect(0, 0, 460, 180);
    playUserBtn.style.display = 'none';
    userPlayer.src = "";
  }

  function drawContour(canvasId, data) {
    if (!data) return;

    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext('2d');
    const points = data.contour;

    const validHz = points.map(p => p.hz).filter(h => h !== null);
    if (!validHz.length) {
      canvas.width = 460;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      return;
    }

    const maxT = points[points.length - 1].t || 1.0;

    const exactAudioWidth = maxT * pixelsPerSecond;
    canvas.width = Math.max(460, exactAudioWidth + 20);

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (data.spectrogram) {
      const img = new Image();
      img.onload = () => {
        ctx.drawImage(img, 10, 0, exactAudioWidth, canvas.height);
        drawPitchLine();
      };
      img.src = data.spectrogram;
    } else {
      drawPitchLine();
    }

    function drawPitchLine() {
      const minHz = Math.min(...validHz) * 0.9;
      const maxHz = Math.max(...validHz) * 1.1;

      ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
      ctx.shadowBlur = 4;
      ctx.shadowOffsetY = 2;

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.8;
      ctx.lineCap = 'round';
      ctx.beginPath();

      let drawing = false;
      points.forEach(p => {
        if (p.hz === null) {
          drawing = false;
          return;
        }

        const x = (p.t * pixelsPerSecond) + 10;
        const y = canvas.height - ((p.hz - minHz) / (maxHz - minHz) * (canvas.height - 30) + 15);

        if (!drawing) {
          ctx.moveTo(x, y);
          drawing = true;
        } else {
          ctx.lineTo(x, y);
        }
      });
      ctx.stroke();
      ctx.shadowColor = 'transparent';
    }
  }

  document.querySelectorAll('.canvas-wrapper').forEach(wrapper => {
    wrapper.addEventListener('wheel', (e) => {
      e.preventDefault();

      const delta = e.deltaY || e.deltaX;

      if (e.shiftKey) {
        wrapper.scrollLeft += delta;
      } else {
        if (delta < 0) {
          pixelsPerSecond *= 1.2;
        } else if (delta > 0) {
          pixelsPerSecond /= 1.2;
        }

        pixelsPerSecond = Math.max(30, Math.min(pixelsPerSecond, 800));

        drawContour('nativeCanvas', currentNativeData);
        drawContour('userCanvas', currentUserData);
      }
    }, { passive: false });
  });

  function handleCanvasClick(e, playerElem) {
    if (!playerElem.src || playerElem.src.endsWith(window.location.host + '/')) return;

    const rect = e.target.getBoundingClientRect();
    const clickX = e.clientX - rect.left;

    let targetTime = (clickX - 10) / pixelsPerSecond;
    if (targetTime < 0) targetTime = 0;

    playerElem.currentTime = targetTime;
    playerElem.play();
  }

  document.getElementById('nativeCanvas').addEventListener('click', (e) => handleCanvasClick(e, nativePlayer));
  document.getElementById('userCanvas').addEventListener('click', (e) => handleCanvasClick(e, userPlayer));

  playNativeBtn.addEventListener('click', () => {
    if (nativePlayer.src) nativePlayer.play();
  });

  playUserBtn.addEventListener('click', () => {
    if (userPlayer.src) userPlayer.play();
  });

  recordBtn.addEventListener('click', async () => {
    if (mediaRecorder && mediaRecorder.state === "recording") {
      mediaRecorder.stop();
      recordBtn.classList.remove('recording');
      recordBtn.textContent = '● Record';
      return;
    }

    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];

    playUserBtn.style.display = 'none';

    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = async () => {
      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });

      userPlayer.src = URL.createObjectURL(audioBlob);
      userPlayer.playbackRate = currentPlaybackRate; // Enforce selected speed on new recording
      playUserBtn.style.display = 'block';
      userPlayer.play();

      const formData = new FormData();
      formData.append("file", audioBlob, "user_recording.webm");

      const response = await fetch('/analyze', { method: 'POST', body: formData });
      currentUserData = await response.json();
      drawContour('userCanvas', currentUserData);
    };

    mediaRecorder.start();
    recordBtn.classList.add('recording');
    recordBtn.textContent = '■ Stop';
  });
</script>
</body>
</html>
