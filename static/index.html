<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pitch & Spectrogram Comparison</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #fbfbfd;
      padding: 24px 16px;
      gap: 20px;
      margin: 0;
      color: #222;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      width: 100%;
      max-width: 620px;
    }
    .sidebar {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      width: 320px;
      height: 82vh;
      display: flex;
      flex-direction: column;
      border: 2px solid transparent;
      transition: border-color 0.15s, background-color 0.15s;
    }
    .sidebar.drag-over-root {
      border-color: #4562a1;
      background: #f4f7fe;
    }
    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid #eee;
      gap: 6px;
    }
    .sidebar-title {
      font-size: 15px;
      font-weight: 700;
      color: #333;
    }
    .sidebar-actions {
      display: flex;
      gap: 6px;
    }
    .mini-btn {
      padding: 7px 10px;
      font-size: 12px;
      border-radius: 6px;
      background: #4562a1;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      width: auto;
    }
    .mini-btn.secondary {
      background: #666;
    }
    .mini-btn:hover { opacity: 0.9; }

    .tree-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      padding-bottom: 60px;
    }
    .empty-hint {
      text-align: center;
      color: #888;
      font-size: 13px;
      margin-top: 36px;
      line-height: 1.6;
      pointer-events: none;
    }

    /* Folder & Audio Tree Rows */
    .tree-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 8px;
      margin-bottom: 5px;
      border-radius: 6px;
      border: 1px solid #e6e6e6;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
      color: #333;
      user-select: none;
      position: relative;
      transition: background 0.12s;
    }
    .tree-row:hover { background: #f5f5f7; }
    .folder-row {
      background: #f8f9fb;
      font-weight: 600;
      border-color: #dde2ec;
    }
    .audio-row.active {
      border-color: #4562a1;
      background: #eef2fb;
      font-weight: 600;
    }

    /* Drag & Drop Visual Indicators */
    .tree-row.drag-inside {
      background: #dce6fb !important;
      border: 1px dashed #4562a1 !important;
    }
    .tree-row.drag-before {
      border-top: 2px solid #4562a1 !important;
    }
    .tree-row.drag-after {
      border-bottom: 2px solid #4562a1 !important;
    }

    .row-left {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      flex: 1;
    }
    .row-label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .caret {
      font-size: 10px;
      width: 14px;
      display: inline-block;
      text-align: center;
      color: #666;
      flex-shrink: 0;
    }
    .row-actions {
      display: none;
      align-items: center;
      gap: 4px;
      margin-left: 6px;
      flex-shrink: 0;
    }
    .tree-row:hover .row-actions {
      display: flex;
    }
    .icon-btn {
      background: #e9ecef;
      color: #333;
      border: none;
      border-radius: 4px;
      padding: 4px 7px;
      font-size: 11px;
      cursor: pointer;
      width: auto;
      font-weight: 600;
    }
    .icon-btn:hover { background: #d0d5dd; }
    .icon-btn.del:hover { background: #e0245e; color: white; }

    /* Player Card Controls & Title */
    .toolbar-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .tool-btn {
      padding: 6px 10px;
      font-size: 12px;
      background: #eee;
      color: #444;
      border: 1px solid #ccc;
      cursor: pointer;
      border-radius: 5px;
      width: auto;
      font-weight: 700;
    }
    .tool-btn:hover { background: #e0e0e0; }
    .tool-btn.active {
      background: #4562a1;
      color: white;
      border-color: #4562a1;
    }
    .jp-text {
      width: 100%;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin: 4px 0 14px 0;
      word-break: break-word;
    }
    .hint {
      font-size: 12px;
      color: #888;
      text-align: center;
      margin-bottom: 18px;
      font-style: italic;
    }

    .panel-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .btn-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 88px;
      flex-shrink: 0;
    }

    .canvas-wrapper {
      flex: 1;
      min-width: 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 6px;
      background: #000;
    }
    .canvas-wrapper::-webkit-scrollbar { height: 8px; }
    .canvas-wrapper::-webkit-scrollbar-track { background: #333; border-radius: 4px; }
    .canvas-wrapper::-webkit-scrollbar-thumb { background: #666; border-radius: 4px; }
    .canvas-wrapper::-webkit-scrollbar-thumb:hover { background: #888; }

    canvas {
      display: block;
      cursor: crosshair;
      touch-action: pan-x;
    }

    button.main-btn {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 12px 10px;
      font-size: 13px;
      font-weight: 600;
      color: white;
      width: 100%;
    }
    .btn-play { background: #4562a1; }
    .btn-play-user { background: #777; display: none; }
    .btn-record { background: #e0245e; }
    .btn-record.recording { background: #111; }

    /* In-App Modal (Replaces window.prompt for mobile compatibility) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 100;
    }
    .modal-overlay.open {
      display: flex;
    }
    .modal-box {
      background: white;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    .modal-title {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 12px 0;
    }
    .modal-input {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 14px;
    }
    .move-list {
      max-height: 240px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    .move-target-btn {
      text-align: left;
      padding: 10px;
      background: #f5f7fa;
      border: 1px solid #dce1eb;
      border-radius: 6px;
      font-size: 14px;
      color: #222;
      cursor: pointer;
    }
    .move-target-btn:hover {
      background: #e4ecfb;
      border-color: #4562a1;
    }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .modal-btn {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .modal-btn.cancel { background: #eee; color: #333; }
    .modal-btn.confirm { background: #4562a1; color: white; }
    .modal-btn.danger { background: #e0245e; color: white; }

    /* Touch & Small Screen Responsive Rules */
    @media (hover: none), (max-width: 960px) {
      .row-actions {
        display: flex;
      }
      .icon-btn {
        padding: 5px 8px;
        font-size: 12px;
      }
    }

    @media (max-width: 960px) {
      body {
        flex-direction: column;
        align-items: stretch;
        padding: 12px;
        gap: 14px;
      }
      .card {
        padding: 16px;
        max-width: 100%;
      }
      .sidebar {
        width: 100%;
        height: 55vh;
        min-height: 320px;
      }
      .jp-text {
        font-size: 19px;
      }
      .panel-row {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .btn-col {
        flex-direction: row;
        width: 100%;
      }
      button.main-btn {
        flex: 1;
        padding: 11px;
      }
      .canvas-wrapper {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="toolbar-row">
    <div class="control-group">
      <button class="tool-btn speed-btn active" data-speed="1.0">1x</button>
      <button class="tool-btn speed-btn" data-speed="0.5">0.5x</button>
      <button class="tool-btn speed-btn" data-speed="0.25">0.25x</button>
    </div>
    <div class="control-group">
      <button class="tool-btn" id="zoomOutBtn" title="Zoom Out">− Zoom</button>
      <button class="tool-btn" id="zoomResetBtn" title="Reset Zoom">100%</button>
      <button class="tool-btn" id="zoomInBtn" title="Zoom In">+ Zoom</button>
    </div>
  </div>

  <div id="jpDisplay" class="jp-text">Add or select audio...</div>
  <div class="hint">Tap graph to play • Swipe or Shift+Scroll to pan • Scroll or +/- to zoom</div>

  <!-- Reference Audio Row -->
  <div class="panel-row">
    <div class="btn-col">
      <button id="playNativeBtn" class="main-btn btn-play">▶ Native</button>
    </div>
    <div class="canvas-wrapper" id="nativeWrapper">
      <canvas id="nativeCanvas" width="460" height="180"></canvas>
    </div>
  </div>

  <!-- User Recording Row -->
  <div class="panel-row">
    <div class="btn-col">
      <button id="recordBtn" class="main-btn btn-record">● Record</button>
      <button id="playUserBtn" class="main-btn btn-play-user">▶ Play</button>
    </div>
    <div class="canvas-wrapper" id="userWrapper">
      <canvas id="userCanvas" width="460" height="180"></canvas>
    </div>
  </div>
</div>

<!-- Right / Bottom Sidebar: Local IndexedDB Library -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="sidebar-title">Audio Library</span>
    <div class="sidebar-actions">
      <button class="mini-btn" id="newRootFolderBtn">+ Folder</button>
      <button class="mini-btn secondary" id="uploadFilesBtn">+ Files</button>
      <input type="file" id="fileInput" multiple accept="audio/*" style="display:none;">
    </div>
  </div>
  <div class="tree-container" id="treeContainer"></div>
</div>

<!-- In-App Modal for Create / Rename / Move / Delete -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h3 class="modal-title" id="modalTitle">Action</h3>
    <div id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<audio id="nativePlayer" playsinline></audio>
<audio id="userPlayer" playsinline></audio>

<script>
  // ==========================================
  // 1. IN-APP MODAL HELPERS (Mobile Safe)
  // ==========================================
  const modalOverlay = document.getElementById('modalOverlay');
  const modalTitle = document.getElementById('modalTitle');
  const modalBody = document.getElementById('modalBody');
  const modalFooter = document.getElementById('modalFooter');

  function closeModal() {
    modalOverlay.classList.remove('open');
    modalBody.innerHTML = '';
    modalFooter.innerHTML = '';
  }

  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) closeModal();
  });

  function showTextModal(title, placeholder, initialValue = '') {
    return new Promise((resolve) => {
      modalTitle.textContent = title;
      modalBody.innerHTML = `<input type="text" class="modal-input" id="modalTextInput" placeholder="${placeholder}" value="${initialValue.replace(/"/g, '&quot;')}">`;
      modalFooter.innerHTML = `
        <button class="modal-btn cancel" id="modalCancelBtn">Cancel</button>
        <button class="modal-btn confirm" id="modalOkBtn">Save</button>
      `;
      modalOverlay.classList.add('open');

      const input = document.getElementById('modalTextInput');
      setTimeout(() => { input.focus(); input.select(); }, 30);

      const finish = (val) => {
        closeModal();
        resolve(val);
      };

      document.getElementById('modalCancelBtn').onclick = () => finish(null);
      document.getElementById('modalOkBtn').onclick = () => finish(input.value.trim() || null);
      input.onkeydown = (e) => {
        if (e.key === 'Enter') finish(input.value.trim() || null);
        if (e.key === 'Escape') finish(null);
      };
    });
  }

  function showConfirmModal(title, message) {
    return new Promise((resolve) => {
      modalTitle.textContent = title;
      modalBody.innerHTML = `<p style="font-size:14px; color:#444; margin:0 0 14px 0;">${message}</p>`;
      modalFooter.innerHTML = `
        <button class="modal-btn cancel" id="modalCancelBtn">Cancel</button>
        <button class="modal-btn danger" id="modalDelBtn">Delete</button>
      `;
      modalOverlay.classList.add('open');

      document.getElementById('modalCancelBtn').onclick = () => { closeModal(); resolve(false); };
      document.getElementById('modalDelBtn').onclick = () => { closeModal(); resolve(true); };
    });
  }

  function showMoveModal(itemType, itemId, itemName) {
    modalTitle.textContent = `Move "${itemName}" to:`;
    modalBody.innerHTML = `<div class="move-list" id="moveList"></div>`;
    modalFooter.innerHTML = `<button class="modal-btn cancel" id="modalCancelBtn">Cancel</button>`;

    const moveList = document.getElementById('moveList');

    // Root option
    const rootBtn = document.createElement('button');
    rootBtn.className = 'move-target-btn';
    rootBtn.textContent = '🏠 Root (Top Level)';
    rootBtn.onclick = async () => {
      closeModal();
      await moveItemToParent(itemType, itemId, null, null, false);
    };
    moveList.appendChild(rootBtn);

    function appendFolderChoices(parentId, depth) {
      const children = folders
        .filter(f => (f.parentId || null) === parentId)
        .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

      children.forEach(f => {
        if (itemType === 'folder' && (f.id === itemId || isDescendant(f.id, itemId))) {
          return;
        }
        const btn = document.createElement('button');
        btn.className = 'move-target-btn';
        btn.style.paddingLeft = `${10 + depth * 16}px`;
        btn.textContent = `📁 ${f.name}`;
        btn.onclick = async () => {
          closeModal();
          f.collapsed = false;
          await dbPut('folders', f);
          await moveItemToParent(itemType, itemId, f.id, null, false);
        };
        moveList.appendChild(btn);
        appendFolderChoices(f.id, depth + 1);
      });
    }

    appendFolderChoices(null, 1);

    modalOverlay.classList.add('open');
    document.getElementById('modalCancelBtn').onclick = closeModal;
  }

  // ==========================================
  // 2. INDEXEDDB STORAGE LAYER
  // ==========================================
  const DB_NAME = 'PitchPracticeDB';
  const DB_VERSION = 1;
  let db = null;

  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const database = e.target.result;
        if (!database.objectStoreNames.contains('folders')) {
          database.createObjectStore('folders', { keyPath: 'id' });
        }
        if (!database.objectStoreNames.contains('audios')) {
          database.createObjectStore('audios', { keyPath: 'id' });
        }
      };
      req.onsuccess = (e) => {
        db = e.target.result;
        resolve(db);
      };
      req.onerror = (e) => reject(e.target.error);
    });
  }

  function dbGetAll(storeName) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readonly');
      const req = tx.objectStore(storeName).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }

  function dbPut(storeName, item) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readwrite');
      const req = tx.objectStore(storeName).put(item);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  function dbDelete(storeName, id) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readwrite');
      const req = tx.objectStore(storeName).delete(id);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  function genId(prefix) {
    return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
  }

  // ==========================================
  // 3. LIBRARY STATE & TREE RENDERING
  // ==========================================
  let folders = [];
  let audios = [];
  let activeAudioId = null;

  let draggedType = null; // 'folder' | 'audio'
  let draggedId = null;

  const sidebar = document.getElementById('sidebar');
  const treeContainer = document.getElementById('treeContainer');
  const fileInput = document.getElementById('fileInput');

  async function refreshLibrary() {
    folders = await dbGetAll('folders');
    audios = await dbGetAll('audios');
    renderTree();
  }

  function isDescendant(potentialDescendantId, folderId) {
    let curr = folders.find(f => f.id === potentialDescendantId);
    while (curr) {
      if (curr.id === folderId) return true;
      curr = folders.find(f => f.id === curr.parentId);
    }
    return false;
  }

  function clearDragClasses() {
    sidebar.classList.remove('drag-over-root');
    document.querySelectorAll('.tree-row').forEach(el => {
      el.classList.remove('drag-inside', 'drag-before', 'drag-after');
    });
  }

  function renderTree() {
    treeContainer.innerHTML = '';

    if (folders.length === 0 && audios.length === 0) {
      treeContainer.innerHTML = `<div class="empty-hint">Tap <b>+ Files</b> or drag audio here.<br>Use <b>+ Folder</b> to organize by language &amp; category.</div>`;
      return;
    }

    function renderLevel(parentId, depth) {
      const levelFolders = folders
        .filter(f => (f.parentId || null) === parentId)
        .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

      const levelAudios = audios
        .filter(a => (a.folderId || null) === parentId)
        .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

      levelFolders.forEach(folder => {
        const row = document.createElement('div');
        row.className = 'tree-row folder-row';
        row.style.marginLeft = `${depth * 14}px`;
        row.draggable = true;

        row.innerHTML = `
          <div class="row-left">
            <span class="caret">${folder.collapsed ? '▶' : '▼'}</span>
            <span>📁</span>
            <span class="row-label" title="${folder.name}">${folder.name}</span>
          </div>
          <div class="row-actions">
            <button class="icon-btn" data-act="sub" title="New Subfolder">+Sub</button>
            <button class="icon-btn" data-act="mov" title="Move Folder">⇄</button>
            <button class="icon-btn" data-act="ren" title="Rename">✎</button>
            <button class="icon-btn del" data-act="del" title="Delete">×</button>
          </div>
        `;

        row.addEventListener('click', async (e) => {
          const act = e.target.dataset.act;
          if (act === 'sub') {
            e.stopPropagation();
            await createFolder(folder.id);
            return;
          }
          if (act === 'mov') {
            e.stopPropagation();
            showMoveModal('folder', folder.id, folder.name);
            return;
          }
          if (act === 'ren') {
            e.stopPropagation();
            const newName = await showTextModal('Rename Folder', 'Folder name', folder.name);
            if (newName) {
              folder.name = newName;
              await dbPut('folders', folder);
              await refreshLibrary();
            }
            return;
          }
          if (act === 'del') {
            e.stopPropagation();
            const ok = await showConfirmModal('Delete Folder', `Delete "${folder.name}" and all items inside it?`);
            if (ok) await deleteFolderRecursive(folder.id);
            return;
          }

          folder.collapsed = !folder.collapsed;
          await dbPut('folders', folder);
          renderTree();
        });

        row.addEventListener('dragstart', (e) => {
          e.stopPropagation();
          draggedType = 'folder';
          draggedId = folder.id;
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', folder.id);
        });

        row.addEventListener('dragend', () => {
          draggedType = null;
          draggedId = null;
          clearDragClasses();
        });

        row.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.stopPropagation();
          clearDragClasses();

          if (draggedType === 'folder' && (draggedId === folder.id || isDescendant(folder.id, draggedId))) {
            return;
          }

          const rect = row.getBoundingClientRect();
          const relY = (e.clientY - rect.top) / rect.height;

          if (!draggedType) {
            row.classList.add('drag-inside');
          } else if (relY < 0.25) {
            row.classList.add('drag-before');
          } else if (relY > 0.75) {
            row.classList.add('drag-after');
          } else {
            row.classList.add('drag-inside');
          }
        });

        row.addEventListener('drop', async (e) => {
          e.preventDefault();
          e.stopPropagation();
          const isInside = row.classList.contains('drag-inside');
          const isBefore = row.classList.contains('drag-before');
          clearDragClasses();

          if (!draggedType && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
            await importExternalFiles(e.dataTransfer.files, folder.id);
            return;
          }

          if (!draggedType) return;
          if (draggedType === 'folder' && (draggedId === folder.id || isDescendant(folder.id, draggedId))) return;

          if (isInside) {
            folder.collapsed = false;
            await dbPut('folders', folder);
            await moveItemToParent(draggedType, draggedId, folder.id, null, true);
          } else {
            await moveItemToParent(draggedType, draggedId, folder.parentId || null, folder, isBefore);
          }
        });

        treeContainer.appendChild(row);

        if (!folder.collapsed) {
          renderLevel(folder.id, depth + 1);
        }
      });

      levelAudios.forEach(audio => {
        const row = document.createElement('div');
        row.className = 'tree-row audio-row' + (audio.id === activeAudioId ? ' active' : '');
        row.style.marginLeft = `${depth * 14}px`;
        row.draggable = true;

        row.innerHTML = `
          <div class="row-left">
            <span>🎵</span>
            <span class="row-label" title="${audio.name}">${audio.name}</span>
          </div>
          <div class="row-actions">
            <button class="icon-btn" data-act="mov" title="Move to Folder">⇄</button>
            <button class="icon-btn" data-act="ren" title="Rename">✎</button>
            <button class="icon-btn del" data-act="del" title="Delete">×</button>
          </div>
        `;

        row.addEventListener('click', async (e) => {
          const act = e.target.dataset.act;
          if (act === 'mov') {
            e.stopPropagation();
            showMoveModal('audio', audio.id, audio.name);
            return;
          }
          if (act === 'ren') {
            e.stopPropagation();
            const newName = await showTextModal('Rename Audio', 'Audio title', audio.name);
            if (newName) {
              audio.name = newName;
              await dbPut('audios', audio);
              if (activeAudioId === audio.id) jpDisplay.textContent = audio.name;
              await refreshLibrary();
            }
            return;
          }
          if (act === 'del') {
            e.stopPropagation();
            await dbDelete('audios', audio.id);
            if (activeAudioId === audio.id) {
              activeAudioId = null;
              jpDisplay.textContent = 'Add or select audio...';
            }
            await refreshLibrary();
            return;
          }

          await loadAudioFromLibrary(audio);
        });

        row.addEventListener('dragstart', (e) => {
          e.stopPropagation();
          draggedType = 'audio';
          draggedId = audio.id;
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', audio.id);
        });

        row.addEventListener('dragend', () => {
          draggedType = null;
          draggedId = null;
          clearDragClasses();
        });

        row.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.stopPropagation();
          clearDragClasses();

          if (draggedType === 'audio' && draggedId === audio.id) return;

          if (!draggedType) {
            row.classList.add('drag-after');
            return;
          }

          const rect = row.getBoundingClientRect();
          const relY = (e.clientY - rect.top) / rect.height;
          row.classList.add(relY < 0.5 ? 'drag-before' : 'drag-after');
        });

        row.addEventListener('drop', async (e) => {
          e.preventDefault();
          e.stopPropagation();
          const isBefore = row.classList.contains('drag-before');
          clearDragClasses();

          if (!draggedType && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
            await importExternalFiles(e.dataTransfer.files, audio.folderId || null);
            return;
          }

          if (!draggedType) return;
          if (draggedType === 'audio' && draggedId === audio.id) return;

          await moveItemToParent(draggedType, draggedId, audio.folderId || null, audio, isBefore);
        });

        treeContainer.appendChild(row);
      });
    }

    renderLevel(null, 0);
  }

  // ==========================================
  // 4. FOLDER & FILE OPERATIONS
  // ==========================================
  async function createFolder(parentId = null) {
    const name = await showTextModal(
      parentId ? 'New Subfolder' : 'New Folder',
      parentId ? 'e.g., Phonemes, Sentences' : 'e.g., Japanese, Italian'
    );
    if (!name) return;

    const siblings = folders.filter(f => (f.parentId || null) === parentId);
    const maxOrder = siblings.reduce((m, f) => Math.max(m, f.order ?? 0), 0);

    await dbPut('folders', {
      id: genId('fld'),
      name: name,
      parentId: parentId,
      order: maxOrder + 10,
      collapsed: false
    });
    await refreshLibrary();
  }

  async function deleteFolderRecursive(folderId) {
    const toDeleteFolders = [folderId];
    let idx = 0;
    while (idx < toDeleteFolders.length) {
      const currId = toDeleteFolders[idx++];
      folders.filter(f => f.parentId === currId).forEach(sub => toDeleteFolders.push(sub.id));
    }

    const audiosToDelete = audios.filter(a => toDeleteFolders.includes(a.folderId));
    for (const a of audiosToDelete) {
      await dbDelete('audios', a.id);
      if (activeAudioId === a.id) {
        activeAudioId = null;
        jpDisplay.textContent = 'Add or select audio...';
      }
    }
    for (const fId of toDeleteFolders) {
      await dbDelete('folders', fId);
    }
    await refreshLibrary();
  }

  async function moveItemToParent(type, id, targetParentId, targetSibling, insertBefore) {
    if (type === 'folder') {
      const item = folders.find(f => f.id === id);
      if (!item) return;
      item.parentId = targetParentId;

      const siblings = folders
        .filter(f => (f.parentId || null) === targetParentId && f.id !== id)
        .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

      if (targetSibling && targetSibling.id.startsWith('fld_')) {
        const sIdx = siblings.findIndex(f => f.id === targetSibling.id);
        const insertIdx = insertBefore ? Math.max(0, sIdx) : sIdx + 1;
        siblings.splice(insertIdx, 0, item);
      } else {
        siblings.push(item);
      }

      for (let i = 0; i < siblings.length; i++) {
        siblings[i].order = (i + 1) * 10;
        await dbPut('folders', siblings[i]);
      }
    } else if (type === 'audio') {
      const item = audios.find(a => a.id === id);
      if (!item) return;
      item.folderId = targetParentId;

      const siblings = audios
        .filter(a => (a.folderId || null) === targetParentId && a.id !== id)
        .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

      if (targetSibling && targetSibling.id.startsWith('aud_')) {
        const sIdx = siblings.findIndex(a => a.id === targetSibling.id);
        const insertIdx = insertBefore ? Math.max(0, sIdx) : sIdx + 1;
        siblings.splice(insertIdx, 0, item);
      } else {
        siblings.push(item);
      }

      for (let i = 0; i < siblings.length; i++) {
        siblings[i].order = (i + 1) * 10;
        await dbPut('audios', siblings[i]);
      }
    }

    await refreshLibrary();
  }

  async function importExternalFiles(fileList, targetFolderId = null) {
    const existing = audios.filter(a => (a.folderId || null) === targetFolderId);
    let nextOrder = existing.reduce((m, a) => Math.max(m, a.order ?? 0), 0) + 10;

    let firstAdded = null;
    for (const file of Array.from(fileList)) {
      if (!file.type.startsWith('audio/') && !file.name.match(/\.(mp3|wav|m4a|ogg|webm|flac|aac)$/i)) {
        continue;
      }
      const cleanName = file.name.replace(/\.[^/.]+$/, '');
      const record = {
        id: genId('aud'),
        name: cleanName,
        folderId: targetFolderId,
        order: nextOrder,
        blob: file,
        analysisData: null
      };
      nextOrder += 10;
      await dbPut('audios', record);
      if (!firstAdded) firstAdded = record;
    }

    await refreshLibrary();
    if (firstAdded && !activeAudioId) {
      await loadAudioFromLibrary(firstAdded);
    }
  }

  // Sidebar Root Dropzone Events
  sidebar.addEventListener('dragover', (e) => {
    e.preventDefault();
    clearDragClasses();
    sidebar.classList.add('drag-over-root');
  });

  sidebar.addEventListener('dragleave', (e) => {
    if (!sidebar.contains(e.relatedTarget)) {
      clearDragClasses();
    }
  });

  sidebar.addEventListener('drop', async (e) => {
    e.preventDefault();
    clearDragClasses();

    if (!draggedType && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
      await importExternalFiles(e.dataTransfer.files, null);
      return;
    }

    if (draggedType) {
      await moveItemToParent(draggedType, draggedId, null, null, false);
    }
  });

  document.getElementById('newRootFolderBtn').addEventListener('click', () => createFolder(null));
  document.getElementById('uploadFilesBtn').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async (e) => {
    if (e.target.files.length > 0) {
      await importExternalFiles(e.target.files, null);
      fileInput.value = '';
    }
  });

  // ==========================================
  // 5. AUDIO PLAYER, PITCH & SPECTROGRAM LOGIC
  // ==========================================
  let mediaRecorder;
  let audioChunks = [];
  let zoomLevel = 1.0; // 1.0 = 5 seconds per visible wrapper width
  let currentPlaybackRate = 1.0;

  let currentNativeData = null;
  let currentUserData = null;
  let currentNativeUrl = null;

  const recordBtn = document.getElementById('recordBtn');
  const playUserBtn = document.getElementById('playUserBtn');
  const jpDisplay = document.getElementById('jpDisplay');
  const playNativeBtn = document.getElementById('playNativeBtn');
  const nativePlayer = document.getElementById('nativePlayer');
  const userPlayer = document.getElementById('userPlayer');

  function getPixelsPerSecond() {
    const wrapperWidth = document.getElementById('nativeWrapper').clientWidth || 460;
    return (wrapperWidth / 5) * zoomLevel;
  }

  function redrawBoth() {
    drawContour('nativeCanvas', currentNativeData);
    drawContour('userCanvas', currentUserData);
  }

  // Speed buttons
  document.querySelectorAll('.speed-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');

      currentPlaybackRate = parseFloat(e.target.dataset.speed);
      nativePlayer.playbackRate = currentPlaybackRate;
      userPlayer.playbackRate = currentPlaybackRate;
    });
  });

  // Touch / Click Zoom buttons
  document.getElementById('zoomInBtn').addEventListener('click', () => {
    zoomLevel = Math.min(zoomLevel * 1.25, 10.0);
    redrawBoth();
  });
  document.getElementById('zoomOutBtn').addEventListener('click', () => {
    zoomLevel = Math.max(zoomLevel / 1.25, 0.3);
    redrawBoth();
  });
  document.getElementById('zoomResetBtn').addEventListener('click', () => {
    zoomLevel = 1.0;
    redrawBoth();
  });

  window.addEventListener('resize', redrawBoth);

  async function loadAudioFromLibrary(audioItem) {
    activeAudioId = audioItem.id;
    renderTree();

    jpDisplay.textContent = audioItem.name;

    if (currentNativeUrl) {
      URL.revokeObjectURL(currentNativeUrl);
    }
    currentNativeUrl = URL.createObjectURL(audioItem.blob);
    nativePlayer.src = currentNativeUrl;
    nativePlayer.playbackRate = currentPlaybackRate;

    // Reset user canvas
    currentUserData = null;
    const userCanvas = document.getElementById('userCanvas');
    const baseW = userCanvas.parentElement.clientWidth || 460;
    userCanvas.width = baseW;
    userCanvas.getContext('2d').clearRect(0, 0, baseW, 180);
    playUserBtn.style.display = 'none';
    userPlayer.src = '';

    if (audioItem.analysisData) {
      currentNativeData = audioItem.analysisData;
      drawContour('nativeCanvas', currentNativeData);
    } else {
      jpDisplay.textContent = `Analyzing: ${audioItem.name}...`;
      const formData = new FormData();
      formData.append('file', audioItem.blob, 'reference_audio');

      const response = await fetch('/analyze', { method: 'POST', body: formData });
      const analyzed = await response.json();

      audioItem.analysisData = analyzed;
      await dbPut('audios', audioItem);

      if (activeAudioId === audioItem.id) {
        jpDisplay.textContent = audioItem.name;
        currentNativeData = analyzed;
        drawContour('nativeCanvas', currentNativeData);
      }
    }
  }

  function drawContour(canvasId, data) {
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext('2d');
    const wrapperWidth = canvas.parentElement.clientWidth || 460;

    if (!data || !data.contour) {
      canvas.width = wrapperWidth;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      return;
    }

    const points = data.contour;
    const validHz = points.map(p => p.hz).filter(h => h !== null);
    if (!validHz.length) {
      canvas.width = wrapperWidth;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      return;
    }

    const pps = getPixelsPerSecond();
    const maxT = points[points.length - 1].t || 1.0;
    const exactAudioWidth = maxT * pps;
    canvas.width = Math.max(wrapperWidth, exactAudioWidth + 20);

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    function drawPitchLine() {
      const minHz = Math.min(...validHz) * 0.9;
      const maxHz = Math.max(...validHz) * 1.1;

      ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
      ctx.shadowBlur = 4;
      ctx.shadowOffsetY = 2;

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.8;
      ctx.lineCap = 'round';
      ctx.beginPath();

      let drawing = false;
      points.forEach(p => {
        if (p.hz === null) {
          drawing = false;
          return;
        }
        const x = (p.t * pps) + 10;
        const y = canvas.height - ((p.hz - minHz) / (maxHz - minHz) * (canvas.height - 30) + 15);

        if (!drawing) {
          ctx.moveTo(x, y);
          drawing = true;
        } else {
          ctx.lineTo(x, y);
        }
      });
      ctx.stroke();
      ctx.shadowColor = 'transparent';
    }

    if (data.spectrogram) {
      if (data._cachedImg && data._cachedImg.complete) {
        ctx.drawImage(data._cachedImg, 10, 0, exactAudioWidth, canvas.height);
        drawPitchLine();
      } else {
        const img = new Image();
        img.onload = () => {
          data._cachedImg = img;
          ctx.drawImage(img, 10, 0, exactAudioWidth, canvas.height);
          drawPitchLine();
        };
        img.src = data.spectrogram;
      }
    } else {
      drawPitchLine();
    }
  }

  // Desktop Wheel Zoom & Shift+Scroll Pan
  document.querySelectorAll('.canvas-wrapper').forEach(wrapper => {
    wrapper.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY || e.deltaX;

      if (e.shiftKey) {
        wrapper.scrollLeft += delta;
      } else {
        if (delta < 0) {
          zoomLevel = Math.min(zoomLevel * 1.2, 10.0);
        } else if (delta > 0) {
          zoomLevel = Math.max(zoomLevel / 1.2, 0.3);
        }
        redrawBoth();
      }
    }, { passive: false });
  });

  // Tap/Click to Play (Ignores horizontal touch swipes)
  function setupCanvasSeek(canvasId, playerElem) {
    const canvas = document.getElementById(canvasId);
    let pointerDownX = 0;

    canvas.addEventListener('pointerdown', (e) => {
      pointerDownX = e.clientX;
    });

    canvas.addEventListener('click', (e) => {
      if (Math.abs(e.clientX - pointerDownX) > 8) return;
      if (!playerElem.src || playerElem.src.endsWith(window.location.host + '/')) return;

      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;

      let targetTime = (clickX - 10) / getPixelsPerSecond();
      if (targetTime < 0) targetTime = 0;

      playerElem.currentTime = targetTime;
      playerElem.play();
    });
  }

  setupCanvasSeek('nativeCanvas', nativePlayer);
  setupCanvasSeek('userCanvas', userPlayer);

  playNativeBtn.addEventListener('click', () => {
    if (nativePlayer.src) nativePlayer.play();
  });

  playUserBtn.addEventListener('click', () => {
    if (userPlayer.src) userPlayer.play();
  });

  // Cross-browser Microphone Recording (Works on iOS Safari, Android, and Desktop)
  recordBtn.addEventListener('click', async () => {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      recordBtn.classList.remove('recording');
      recordBtn.textContent = '● Record';
      return;
    }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mimeType = MediaRecorder.isTypeSupported('audio/webm')
        ? 'audio/webm'
        : (MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : '');

      mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
      audioChunks = [];

      playUserBtn.style.display = 'none';

      mediaRecorder.ondataavailable = e => {
        if (e.data && e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRecorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        const blobType = mediaRecorder.mimeType || 'audio/webm';
        const audioBlob = new Blob(audioChunks, { type: blobType });

        userPlayer.src = URL.createObjectURL(audioBlob);
        userPlayer.playbackRate = currentPlaybackRate;
        playUserBtn.style.display = 'block';
        userPlayer.play();

        const formData = new FormData();
        formData.append('file', audioBlob, 'user_recording');

        const response = await fetch('/analyze', { method: 'POST', body: formData });
        currentUserData = await response.json();
        drawContour('userCanvas', currentUserData);
      };

      mediaRecorder.start();
      recordBtn.classList.add('recording');
      recordBtn.textContent = '■ Stop';
    } catch (err) {
      alert('Microphone access denied or unavailable. Ensure you are using HTTPS or localhost.');
    }
  });

  openDB().then(() => {
    refreshLibrary();
    redrawBoth();
  });
</script>
</body>
