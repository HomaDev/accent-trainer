<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pitch & Spectrogram Comparison (Local Library)</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #fbfbfd;
      padding-top: 30px;
      gap: 20px;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      width: 600px;
    }
    .sidebar {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      width: 300px;
      height: 82vh;
      display: flex;
      flex-direction: column;
      border: 2px solid transparent;
      transition: border-color 0.15s, background-color 0.15s;
    }
    .sidebar.drag-over-root {
      border-color: #4562a1;
      background: #f4f7fe;
    }
    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid #eee;
      gap: 6px;
    }
    .sidebar-title {
      font-size: 14px;
      font-weight: 700;
      color: #333;
    }
    .sidebar-actions {
      display: flex;
      gap: 5px;
    }
    .mini-btn {
      padding: 5px 8px;
      font-size: 11px;
      border-radius: 5px;
      background: #4562a1;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      width: auto;
    }
    .mini-btn.secondary {
      background: #666;
    }
    .mini-btn:hover { opacity: 0.9; }

    .tree-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-bottom: 40px;
    }
    .empty-hint {
      text-align: center;
      color: #999;
      font-size: 13px;
      margin-top: 40px;
      line-height: 1.5;
      pointer-events: none;
    }

    /* Folder & Audio Tree Rows */
    .tree-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 8px;
      border-radius: 6px;
      border: 1px solid #e6e6e6;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
      color: #333;
      user-select: none;
      position: relative;
      transition: background 0.12s;
    }
    .tree-row:hover { background: #f5f5f7; }
    .folder-row {
      background: #f8f9fb;
      font-weight: 600;
      border-color: #dde2ec;
    }
    .audio-row.active {
      border-color: #4562a1;
      background: #eef2fb;
      font-weight: 600;
    }

    /* Drag & Drop Visual Indicators */
    .tree-row.drag-inside {
      background: #dce6fb !important;
      border: 1px dashed #4562a1 !important;
    }
    .tree-row.drag-before {
      border-top: 2px solid #4562a1 !important;
    }
    .tree-row.drag-after {
      border-bottom: 2px solid #4562a1 !important;
    }

    .row-left {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      flex: 1;
    }
    .row-label {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .caret {
      font-size: 10px;
      width: 12px;
      display: inline-block;
      text-align: center;
      color: #666;
    }
    .row-actions {
      display: none;
      align-items: center;
      gap: 3px;
      margin-left: 4px;
    }
    .tree-row:hover .row-actions {
      display: flex;
    }
    .icon-btn {
      background: #e9ecef;
      color: #444;
      border: none;
      border-radius: 4px;
      padding: 2px 5px;
      font-size: 10px;
      cursor: pointer;
      width: auto;
      font-weight: 600;
    }
    .icon-btn:hover { background: #d0d5dd; }
    .icon-btn.del:hover { background: #e0245e; color: white; }

    /* Player Card Styling */
    .header-row {
      display: flex;
      align-items: center;
      position: relative;
      margin-bottom: 25px;
      min-height: 32px;
    }
    .speed-controls {
      position: absolute;
      left: 0;
      top: 0;
      display: flex;
      gap: 5px;
      z-index: 2;
    }
    .speed-btn {
      padding: 4px 8px;
      font-size: 12px;
      background: #eee;
      color: #555;
      border: 1px solid #ccc;
      cursor: pointer;
      border-radius: 4px;
      width: auto;
      font-weight: bold;
    }
    .speed-btn:hover { background: #e0e0e0; }
    .speed-btn.active {
      background: #4562a1;
      color: white;
      border-color: #4562a1;
    }
    .jp-text {
      width: 100%;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin: 0;
      padding: 0 110px;
      box-sizing: border-box;
      word-break: break-word;
    }

    .panel-row { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
    .btn-col { display: flex; flex-direction: column; gap: 8px; min-width: 90px; }

    .canvas-wrapper {
      width: 460px;
      overflow-x: auto;
      border-radius: 6px;
      background: #000;
    }
    .canvas-wrapper::-webkit-scrollbar { height: 8px; }
    .canvas-wrapper::-webkit-scrollbar-track { background: #333; border-radius: 4px; }
    .canvas-wrapper::-webkit-scrollbar-thumb { background: #666; border-radius: 4px; }
    .canvas-wrapper::-webkit-scrollbar-thumb:hover { background: #888; }

    canvas {
      display: block;
      cursor: crosshair;
    }

    button.main-btn { cursor: pointer; border: none; border-radius: 6px; padding: 10px 15px; font-weight: 600; color: white; width: 100%; box-sizing: border-box; }
    .btn-play { background: #4562a1; }
    .btn-play-user { background: #777; display: none; }
    .btn-record { background: #e0245e; }
    .btn-record.recording { background: #111; }

    .hint { font-size: 12px; color: #888; text-align: center; margin-top: -15px; margin-bottom: 20px; font-style: italic; }
  </style>
</head>
<body>

<div class="card">
  <div class="header-row">
    <div class="speed-controls">
      <button class="speed-btn active" data-speed="1.0">1x</button>
      <button class="speed-btn" data-speed="0.5">0.5x</button>
      <button class="speed-btn" data-speed="0.25">0.25x</button>
    </div>
    <div id="jpDisplay" class="jp-text">Drop or select audio...</div>
  </div>

  <div class="hint">Scroll = Zoom In/Out | Shift + Scroll = Move Left/Right | Click Graph = Play</div>

  <!-- Reference Audio Row -->
  <div class="panel-row">
    <div class="btn-col">
      <button id="playNativeBtn" class="main-btn btn-play">▶ Native</button>
    </div>
    <div class="canvas-wrapper" id="nativeWrapper">
      <canvas id="nativeCanvas" width="460" height="180"></canvas>
    </div>
  </div>

  <!-- User Recording Row -->
  <div class="panel-row">
    <div class="btn-col">
      <button id="recordBtn" class="main-btn btn-record">● Record</button>
      <button id="playUserBtn" class="main-btn btn-play-user">▶ Play</button>
    </div>
    <div class="canvas-wrapper" id="userWrapper">
      <canvas id="userCanvas" width="460" height="180"></canvas>
    </div>
  </div>
</div>

<!-- Right Sidebar: Local IndexedDB Library -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <span class="sidebar-title">Audio Library</span>
    <div class="sidebar-actions">
      <button class="mini-btn" id="newRootFolderBtn">+ Folder</button>
      <button class="mini-btn secondary" id="uploadFilesBtn">+ Files</button>
      <input type="file" id="fileInput" multiple accept="audio/*" style="display:none;">
    </div>
  </div>
  <div class="tree-container" id="treeContainer"></div>
</div>

<audio id="nativePlayer"></audio>
<audio id="userPlayer"></audio>

<script>
  // ==========================================
  // 1. INDEXEDDB STORAGE LAYER
  // ==========================================
  const DB_NAME = 'PitchPracticeDB';
  const DB_VERSION = 1;
  let db = null;

  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = (e) => {
        const database = e.target.result;
        if (!database.objectStoreNames.contains('folders')) {
          database.createObjectStore('folders', { keyPath: 'id' });
        }
        if (!database.objectStoreNames.contains('audios')) {
          database.createObjectStore('audios', { keyPath: 'id' });
        }
      };
      req.onsuccess = (e) => {
        db = e.target.result;
        resolve(db);
      };
      req.onerror = (e) => reject(e.target.error);
    });
  }

  function dbGetAll(storeName) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readonly');
      const req = tx.objectStore(storeName).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }

  function dbPut(storeName, item) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readwrite');
      const req = tx.objectStore(storeName).put(item);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  function dbDelete(storeName, id) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, 'readwrite');
      const req = tx.objectStore(storeName).delete(id);
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  function genId(prefix) {
    return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
  }

  // ==========================================
  // 2. LIBRARY STATE & TREE RENDERING
  // ==========================================
  let folders = [];
  let audios = [];
  let activeAudioId = null;

  // Internal Drag & Drop state
  let draggedType = null; // 'folder' | 'audio'
  let draggedId = null;

  const sidebar = document.getElementById('sidebar');
  const treeContainer = document.getElementById('treeContainer');
  const fileInput = document.getElementById('fileInput');

  async function refreshLibrary() {
    folders = await dbGetAll('folders');
    audios = await dbGetAll('audios');
    renderTree();
  }

  function isDescendant(potentialDescendantId, folderId) {
    let curr = folders.find(f => f.id === potentialDescendantId);
    while (curr) {
      if (curr.id === folderId) return true;
      curr = folders.find(f => f.id === curr.parentId);
    }
    return false;
  }

  function clearDragClasses() {
    sidebar.classList.remove('drag-over-root');
    document.querySelectorAll('.tree-row').forEach(el => {
      el.classList.remove('drag-inside', 'drag-before', 'drag-after');
    });
  }

  function renderTree() {
    treeContainer.innerHTML = '';

    if (folders.length === 0 && audios.length === 0) {
      treeContainer.innerHTML = `<div class="empty-hint">Drag & drop audio files here<br>or click <b>+ Folder</b> to organize.</div>`;
      return;
    }

    function renderLevel(parentId, depth) {
      const levelFolders = folders
        .filter(f => (f.parentId || null) === parentId)
        .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

      const levelAudios = audios
        .filter(a => (a.folderId || null) === parentId)
        .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

      // Render Folders first at this level
      levelFolders.forEach(folder => {
        const row = document.createElement('div');
        row.className = 'tree-row folder-row';
        row.style.marginLeft = `${depth * 14}px`;
        row.draggable = true;

        row.innerHTML = `
          <div class="row-left">
            <span class="caret">${folder.collapsed ? '▶' : '▼'}</span>
            <span>📁</span>
            <span class="row-label" title="${folder.name}">${folder.name}</span>
          </div>
          <div class="row-actions">
            <button class="icon-btn" data-act="sub" title="New Subfolder">+Sub</button>
            <button class="icon-btn" data-act="ren" title="Rename">✎</button>
            <button class="icon-btn del" data-act="del" title="Delete">×</button>
          </div>
        `;

        // Toggle collapse on click
        row.addEventListener('click', async (e) => {
          const act = e.target.dataset.act;
          if (act === 'sub') {
            e.stopPropagation();
            await createFolder(folder.id);
            return;
          }
          if (act === 'ren') {
            e.stopPropagation();
            const newName = prompt('Rename folder:', folder.name);
            if (newName && newName.trim()) {
              folder.name = newName.trim();
              await dbPut('folders', folder);
              await refreshLibrary();
            }
            return;
          }
          if (act === 'del') {
            e.stopPropagation();
            if (confirm(`Delete folder "${folder.name}" and everything inside it?`)) {
              await deleteFolderRecursive(folder.id);
            }
            return;
          }

          folder.collapsed = !folder.collapsed;
          await dbPut('folders', folder);
          renderTree();
        });

        // Internal Drag Start
        row.addEventListener('dragstart', (e) => {
          e.stopPropagation();
          draggedType = 'folder';
          draggedId = folder.id;
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', folder.id);
        });

        row.addEventListener('dragend', () => {
          draggedType = null;
          draggedId = null;
          clearDragClasses();
        });

        // Drag Over Folder (Top 25% = before, Middle 50% = inside folder, Bottom 25% = after)
        row.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.stopPropagation();
          clearDragClasses();

          if (draggedType === 'folder' && (draggedId === folder.id || isDescendant(folder.id, draggedId))) {
            return;
          }

          const rect = row.getBoundingClientRect();
          const relY = (e.clientY - rect.top) / rect.height;

          if (!draggedType) {
            // External OS files always drop inside the folder
            row.classList.add('drag-inside');
          } else if (relY < 0.25) {
            row.classList.add('drag-before');
          } else if (relY > 0.75) {
            row.classList.add('drag-after');
          } else {
            row.classList.add('drag-inside');
          }
        });

        row.addEventListener('drop', async (e) => {
          e.preventDefault();
          e.stopPropagation();
          const isInside = row.classList.contains('drag-inside');
          const isBefore = row.classList.contains('drag-before');
          clearDragClasses();

          // External OS Files dropped onto this folder
          if (!draggedType && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
            await importExternalFiles(e.dataTransfer.files, folder.id);
            return;
          }

          if (!draggedType) return;
          if (draggedType === 'folder' && (draggedId === folder.id || isDescendant(folder.id, draggedId))) return;

          if (isInside) {
            // Move inside this folder
            folder.collapsed = false;
            await dbPut('folders', folder);
            await moveItemToParent(draggedType, draggedId, folder.id, null, true);
          } else {
            // Reorder before or after this folder in the same parent
            await moveItemToParent(draggedType, draggedId, folder.parentId || null, folder, isBefore);
          }
        });

        treeContainer.appendChild(row);

        if (!folder.collapsed) {
          renderLevel(folder.id, depth + 1);
        }
      });

      // Render Audio Items at this level
      levelAudios.forEach(audio => {
        const row = document.createElement('div');
        row.className = 'tree-row audio-row' + (audio.id === activeAudioId ? ' active' : '');
        row.style.marginLeft = `${depth * 14}px`;
        row.draggable = true;

        row.innerHTML = `
          <div class="row-left">
            <span>🎵</span>
            <span class="row-label" title="${audio.name}">${audio.name}</span>
          </div>
          <div class="row-actions">
            <button class="icon-btn" data-act="ren" title="Rename">✎</button>
            <button class="icon-btn del" data-act="del" title="Delete">×</button>
          </div>
        `;

        row.addEventListener('click', async (e) => {
          const act = e.target.dataset.act;
          if (act === 'ren') {
            e.stopPropagation();
            const newName = prompt('Rename audio:', audio.name);
            if (newName && newName.trim()) {
              audio.name = newName.trim();
              await dbPut('audios', audio);
              if (activeAudioId === audio.id) jpDisplay.textContent = audio.name;
              await refreshLibrary();
            }
            return;
          }
          if (act === 'del') {
            e.stopPropagation();
            await dbDelete('audios', audio.id);
            if (activeAudioId === audio.id) {
              activeAudioId = null;
              jpDisplay.textContent = 'Drop or select audio...';
            }
            await refreshLibrary();
            return;
          }

          await loadAudioFromLibrary(audio);
        });

        row.addEventListener('dragstart', (e) => {
          e.stopPropagation();
          draggedType = 'audio';
          draggedId = audio.id;
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', audio.id);
        });

        row.addEventListener('dragend', () => {
          draggedType = null;
          draggedId = null;
          clearDragClasses();
        });

        row.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.stopPropagation();
          clearDragClasses();

          if (draggedType === 'audio' && draggedId === audio.id) return;

          if (!draggedType) {
            row.classList.add('drag-after');
            return;
          }

          const rect = row.getBoundingClientRect();
          const relY = (e.clientY - rect.top) / rect.height;
          row.classList.add(relY < 0.5 ? 'drag-before' : 'drag-after');
        });

        row.addEventListener('drop', async (e) => {
          e.preventDefault();
          e.stopPropagation();
          const isBefore = row.classList.contains('drag-before');
          clearDragClasses();

          // External OS files dropped onto an audio item -> place in the same folder
          if (!draggedType && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
            await importExternalFiles(e.dataTransfer.files, audio.folderId || null);
            return;
          }

          if (!draggedType) return;
          if (draggedType === 'audio' && draggedId === audio.id) return;

          await moveItemToParent(draggedType, draggedId, audio.folderId || null, audio, isBefore);
        });

        treeContainer.appendChild(row);
      });
    }

    renderLevel(null, 0);
  }

  // ==========================================
  // 3. FOLDER & FILE OPERATIONS
  // ==========================================
  async function createFolder(parentId = null) {
    const name = prompt(parentId ? 'Subfolder name:' : 'Folder name:');
    if (!name || !name.trim()) return;

    const siblings = folders.filter(f => (f.parentId || null) === parentId);
    const maxOrder = siblings.reduce((m, f) => Math.max(m, f.order ?? 0), 0);

    await dbPut('folders', {
      id: genId('fld'),
      name: name.trim(),
      parentId: parentId,
      order: maxOrder + 10,
      collapsed: false
    });
    await refreshLibrary();
  }

  async function deleteFolderRecursive(folderId) {
    const toDeleteFolders = [folderId];
    let idx = 0;
    while (idx < toDeleteFolders.length) {
      const currId = toDeleteFolders[idx++];
      folders.filter(f => f.parentId === currId).forEach(sub => toDeleteFolders.push(sub.id));
    }

    const audiosToDelete = audios.filter(a => toDeleteFolders.includes(a.folderId));
    for (const a of audiosToDelete) {
      await dbDelete('audios', a.id);
      if (activeAudioId === a.id) {
        activeAudioId = null;
        jpDisplay.textContent = 'Drop or select audio...';
      }
    }
    for (const fId of toDeleteFolders) {
      await dbDelete('folders', fId);
    }
    await refreshLibrary();
  }

  async function moveItemToParent(type, id, targetParentId, targetSibling, insertBefore) {
    if (type === 'folder') {
      const item = folders.find(f => f.id === id);
      if (!item) return;
      item.parentId = targetParentId;

      const siblings = folders
        .filter(f => (f.parentId || null) === targetParentId && f.id !== id)
        .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

      if (targetSibling && targetSibling.id.startsWith('fld_')) {
        const sIdx = siblings.findIndex(f => f.id === targetSibling.id);
        const insertIdx = insertBefore ? Math.max(0, sIdx) : sIdx + 1;
        siblings.splice(insertIdx, 0, item);
      } else {
        siblings.push(item);
      }

      for (let i = 0; i < siblings.length; i++) {
        siblings[i].order = (i + 1) * 10;
        await dbPut('folders', siblings[i]);
      }
    } else if (type === 'audio') {
      const item = audios.find(a => a.id === id);
      if (!item) return;
      item.folderId = targetParentId;

      const siblings = audios
        .filter(a => (a.folderId || null) === targetParentId && a.id !== id)
        .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

      if (targetSibling && targetSibling.id.startsWith('aud_')) {
        const sIdx = siblings.findIndex(a => a.id === targetSibling.id);
        const insertIdx = insertBefore ? Math.max(0, sIdx) : sIdx + 1;
        siblings.splice(insertIdx, 0, item);
      } else {
        siblings.push(item);
      }

      for (let i = 0; i < siblings.length; i++) {
        siblings[i].order = (i + 1) * 10;
        await dbPut('audios', siblings[i]);
      }
    }

    await refreshLibrary();
  }

  async function importExternalFiles(fileList, targetFolderId = null) {
    const existing = audios.filter(a => (a.folderId || null) === targetFolderId);
    let nextOrder = existing.reduce((m, a) => Math.max(m, a.order ?? 0), 0) + 10;

    let firstAdded = null;
    for (const file of Array.from(fileList)) {
      if (!file.type.startsWith('audio/') && !file.name.match(/\.(mp3|wav|m4a|ogg|webm|flac|aac)$/i)) {
        continue;
      }
      const cleanName = file.name.replace(/\.[^/.]+$/, '');
      const record = {
        id: genId('aud'),
        name: cleanName,
        folderId: targetFolderId,
        order: nextOrder,
        blob: file,
        analysisData: null
      };
      nextOrder += 10;
      await dbPut('audios', record);
      if (!firstAdded) firstAdded = record;
    }

    await refreshLibrary();
    if (firstAdded && !activeAudioId) {
      await loadAudioFromLibrary(firstAdded);
    }
  }

  // Sidebar Root Dropzone Events
  sidebar.addEventListener('dragover', (e) => {
    e.preventDefault();
    clearDragClasses();
    sidebar.classList.add('drag-over-root');
  });

  sidebar.addEventListener('dragleave', (e) => {
    if (!sidebar.contains(e.relatedTarget)) {
      clearDragClasses();
    }
  });

  sidebar.addEventListener('drop', async (e) => {
    e.preventDefault();
    clearDragClasses();

    if (!draggedType && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
      await importExternalFiles(e.dataTransfer.files, null);
      return;
    }

    if (draggedType) {
      await moveItemToParent(draggedType, draggedId, null, null, false);
    }
  });

  document.getElementById('newRootFolderBtn').addEventListener('click', () => createFolder(null));
  document.getElementById('uploadFilesBtn').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async (e) => {
    if (e.target.files.length > 0) {
      await importExternalFiles(e.target.files, null);
      fileInput.value = '';
    }
  });

  // ==========================================
  // 4. AUDIO PLAYER, PITCH & SPECTROGRAM LOGIC
  // ==========================================
  let mediaRecorder;
  let audioChunks = [];
  let pixelsPerSecond = 460 / 5;
  let currentPlaybackRate = 1.0;

  let currentNativeData = null;
  let currentUserData = null;
  let currentNativeUrl = null;

  const recordBtn = document.getElementById('recordBtn');
  const playUserBtn = document.getElementById('playUserBtn');
  const jpDisplay = document.getElementById('jpDisplay');
  const playNativeBtn = document.getElementById('playNativeBtn');
  const nativePlayer = document.getElementById('nativePlayer');
  const userPlayer = document.getElementById('userPlayer');

  document.querySelectorAll('.speed-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');

      currentPlaybackRate = parseFloat(e.target.dataset.speed);
      nativePlayer.playbackRate = currentPlaybackRate;
      userPlayer.playbackRate = currentPlaybackRate;
    });
  });

  async function loadAudioFromLibrary(audioItem) {
    activeAudioId = audioItem.id;
    renderTree();

    jpDisplay.textContent = audioItem.name;

    if (currentNativeUrl) {
      URL.revokeObjectURL(currentNativeUrl);
    }
    currentNativeUrl = URL.createObjectURL(audioItem.blob);
    nativePlayer.src = currentNativeUrl;
    nativePlayer.playbackRate = currentPlaybackRate;

    // Reset user canvas
    currentUserData = null;
    const userCanvas = document.getElementById('userCanvas');
    userCanvas.width = 460;
    userCanvas.getContext('2d').clearRect(0, 0, 460, 180);
    playUserBtn.style.display = 'none';
    userPlayer.src = '';

    // Use cached analysis if available, otherwise send blob to backend and cache result
    if (audioItem.analysisData) {
      currentNativeData = audioItem.analysisData;
      drawContour('nativeCanvas', currentNativeData);
    } else {
      jpDisplay.textContent = `Analyzing: ${audioItem.name}...`;
      const formData = new FormData();
      formData.append('file', audioItem.blob, 'reference_audio');

      const response = await fetch('analyze', { method: 'POST', body: formData });
      const analyzed = await response.json();

      audioItem.analysisData = analyzed;
      await dbPut('audios', audioItem);

      if (activeAudioId === audioItem.id) {
        jpDisplay.textContent = audioItem.name;
        currentNativeData = analyzed;
        drawContour('nativeCanvas', currentNativeData);
      }
    }
  }

  function drawContour(canvasId, data) {
    if (!data) return;

    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext('2d');
    const points = data.contour;

    const validHz = points.map(p => p.hz).filter(h => h !== null);
    if (!validHz.length) {
      canvas.width = 460;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      return;
    }

    const maxT = points[points.length - 1].t || 1.0;
    const exactAudioWidth = maxT * pixelsPerSecond;
    canvas.width = Math.max(460, exactAudioWidth + 20);

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    function drawPitchLine() {
      const minHz = Math.min(...validHz) * 0.9;
      const maxHz = Math.max(...validHz) * 1.1;

      ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
      ctx.shadowBlur = 4;
      ctx.shadowOffsetY = 2;

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.8;
      ctx.lineCap = 'round';
      ctx.beginPath();

      let drawing = false;
      points.forEach(p => {
        if (p.hz === null) {
          drawing = false;
          return;
        }
        const x = (p.t * pixelsPerSecond) + 10;
        const y = canvas.height - ((p.hz - minHz) / (maxHz - minHz) * (canvas.height - 30) + 15);

        if (!drawing) {
          ctx.moveTo(x, y);
          drawing = true;
        } else {
          ctx.lineTo(x, y);
        }
      });
      ctx.stroke();
      ctx.shadowColor = 'transparent';
    }

    if (data.spectrogram) {
      // Cache decoded Image object on data to prevent flicker during zoom
      if (data._cachedImg && data._cachedImg.complete) {
        ctx.drawImage(data._cachedImg, 10, 0, exactAudioWidth, canvas.height);
        drawPitchLine();
      } else {
        const img = new Image();
        img.onload = () => {
          data._cachedImg = img;
          ctx.drawImage(img, 10, 0, exactAudioWidth, canvas.height);
          drawPitchLine();
        };
        img.src = data.spectrogram;
      }
    } else {
      drawPitchLine();
    }
  }

  document.querySelectorAll('.canvas-wrapper').forEach(wrapper => {
    wrapper.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY || e.deltaX;

      if (e.shiftKey) {
        wrapper.scrollLeft += delta;
      } else {
        if (delta < 0) {
          pixelsPerSecond *= 1.2;
        } else if (delta > 0) {
          pixelsPerSecond /= 1.2;
        }
        pixelsPerSecond = Math.max(30, Math.min(pixelsPerSecond, 800));

        drawContour('nativeCanvas', currentNativeData);
        drawContour('userCanvas', currentUserData);
      }
    }, { passive: false });
  });

  function handleCanvasClick(e, playerElem) {
    if (!playerElem.src || playerElem.src.endsWith(window.location.host + '/')) return;

    const rect = e.target.getBoundingClientRect();
    const clickX = e.clientX - rect.left;

    let targetTime = (clickX - 10) / pixelsPerSecond;
    if (targetTime < 0) targetTime = 0;

    playerElem.currentTime = targetTime;
    playerElem.play();
  }

  document.getElementById('nativeCanvas').addEventListener('click', (e) => handleCanvasClick(e, nativePlayer));
  document.getElementById('userCanvas').addEventListener('click', (e) => handleCanvasClick(e, userPlayer));

  playNativeBtn.addEventListener('click', () => {
    if (nativePlayer.src) nativePlayer.play();
  });

  playUserBtn.addEventListener('click', () => {
    if (userPlayer.src) userPlayer.play();
  });

  recordBtn.addEventListener('click', async () => {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      recordBtn.classList.remove('recording');
      recordBtn.textContent = '● Record';
      return;
    }

    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    audioChunks = [];

    playUserBtn.style.display = 'none';

    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = async () => {
      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });

      userPlayer.src = URL.createObjectURL(audioBlob);
      userPlayer.playbackRate = currentPlaybackRate;
      playUserBtn.style.display = 'block';
      userPlayer.play();

      const formData = new FormData();
      formData.append('file', audioBlob, 'user_recording.webm');

      const response = await fetch('/analyze', { method: 'POST', body: formData });
      currentUserData = await response.json();
      drawContour('userCanvas', currentUserData);
    };

    mediaRecorder.start();
    recordBtn.classList.add('recording');
    recordBtn.textContent = '■ Stop';
  });

  // Initialize DB and load library on page open
  openDB().then(() => refreshLibrary());
</script>
</body>
</html>
